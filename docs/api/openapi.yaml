openapi: 3.0.3
info:
  title: SCGI API
  version: 1.0.0
  description: |
    Contrato de la API REST del Sistema Centralizado de Gestión de Infraestructura (SCGI),
    acordado entre Taller de Integración II (backend y web) y Taller de Integración IV (app móvil).

    Reglas:
    - Todas las rutas van bajo /api/v1 y se sirven solo por HTTPS (RNF3).
    - Todas las rutas, salvo POST /auth/login, exigen el token JWT (RNF4).
    - Todos los errores responden con el esquema Error.

    Versionado:
    - Agregar rutas o campos opcionales sube la versión menor (1.0.0 a 1.1.0).
    - Quitar o renombrar rutas o campos, o cambiar su tipo, sube la versión mayor (2.0.0)
      y la ruta base pasa a /api/v2.
    - Todo cambio se acuerda entre TI2 y TI4 antes de implementarlo.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Autenticacion
    description: Inicio de sesión y usuario actual (RF1).
  - name: Activos
    description: Identificación de activos por QR y búsqueda manual (RF2).

paths:

  /auth/login:
    post:
      tags:
        - Autenticacion
      summary: Iniciar sesión con correo y contraseña
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales correctas. Devuelve el token y el usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          description: Correo o contraseña incorrectos, o usuario eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /auth/me:
    get:
      tags:
        - Autenticacion
      summary: Obtener el usuario dueño del token
      description: Se usa en el auto-login para comprobar que el token guardado sigue siendo válido.
      operationId: obtenerUsuarioActual
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /activos:
    get:
      tags:
        - Activos
      summary: Buscar activos por texto (búsqueda manual)
      description: |
        Busca en nombre y codigo_qr. Se usa cuando el QR no se puede leer
        o el código no está registrado.
      operationId: buscarActivos
      parameters:
        - name: busqueda
          in: query
          required: true
          description: Texto a buscar.
          schema:
            type: string
            minLength: 1
        - name: limite
          in: query
          required: false
          description: Cantidad máxima de resultados.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Activos que coinciden. Lista vacía si no hay coincidencias.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /activos/qr/{codigo_qr}:
    get:
      tags:
        - Activos
      summary: Obtener un activo a partir del contenido de su código QR
      operationId: obtenerActivoPorQr
      parameters:
        - name: codigo_qr
          in: path
          required: true
          description: Contenido leído del código QR, codificado para URL.
          schema:
            type: string
      responses:
        '200':
          description: Activo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /activos/{id_activo}:
    get:
      tags:
        - Activos
      summary: Obtener un activo por su id
      operationId: obtenerActivoPorId
      parameters:
        - name: id_activo
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Activo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token que devuelve POST /auth/login. Se envía en cada petición protegida:
        Authorization: Bearer <token>

        El payload del token debe incluir:
        - sub: id_usuario (UUID).
        - rol: nombre_rol, con los mismos valores del esquema Rol.
        - exp: fecha de expiración (segundos Unix).

  responses:
    DatosInvalidos:
      description: La petición tiene datos faltantes o con formato incorrecto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Falta el token, es inválido o expiró. La app debe cerrar la sesión.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorServidor:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      description: Formato único de todos los errores.
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          description: Explicación del error, apta para mostrar al usuario.

    LoginRequest:
      type: object
      required:
        - correo
        - password
      properties:
        correo:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true

    LoginResponse:
      type: object
      required:
        - token
        - usuario
      properties:
        token:
          type: string
          description: JWT firmado. Su contenido se describe en bearerAuth.
        usuario:
          $ref: '#/components/schemas/Usuario'

    Rol:
      type: object
      description: Rol del usuario (tabla ROLES).
      required:
        - id_rol
        - nombre_rol
      properties:
        id_rol:
          type: integer
        nombre_rol:
          type: string
          enum:
            - REPORTANTE
            - SUPERVISOR
            - TECNICO
            - ADMINISTRADOR

    Usuario:
      type: object
      description: Usuario del sistema (tabla USUARIOS). No incluye password_hash.
      required:
        - id_usuario
        - rut_o_id
        - nombre
        - apellido
        - correo
        - rol
        - created_at
      properties:
        id_usuario:
          type: string
          format: uuid
        rut_o_id:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        created_at:
          type: string
          format: date-time
          readOnly: true

    Edificio:
      type: object
      description: Edificio de la institución (tabla EDIFICIOS).
      required:
        - id_edificio
        - nombre_edificio
      properties:
        id_edificio:
          type: integer
        nombre_edificio:
          type: string

    Ubicacion:
      type: object
      description: Espacio dentro de un edificio (tabla UBICACIONES).
      required:
        - id_ubicacion
        - nombre_espacio
        - edificio
      properties:
        id_ubicacion:
          type: integer
        nombre_espacio:
          type: string
        edificio:
          $ref: '#/components/schemas/Edificio'

    Categoria:
      type: object
      description: Categoría del activo (tabla CATEGORIAS).
      required:
        - id_categoria
        - nombre_categoria
      properties:
        id_categoria:
          type: integer
        nombre_categoria:
          type: string

    EstadoActivo:
      type: object
      description: Estado del activo (tabla ESTADOS_ACTIVO).
      required:
        - id_estado_activo
        - nombre_estado
      properties:
        id_estado_activo:
          type: integer
        nombre_estado:
          type: string

    Activo:
      type: object
      description: Activo de infraestructura (tabla ACTIVOS). No incluye deleted_at.
      required:
        - id_activo
        - codigo_qr
        - nombre
        - estado
        - categoria
        - ubicacion
        - created_at
      properties:
        id_activo:
          type: string
          format: uuid
        codigo_qr:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        marca:
          type: string
          nullable: true
        modelo:
          type: string
          nullable: true
        numero_serie:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoActivo'
        categoria:
          $ref: '#/components/schemas/Categoria'
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        created_at:
          type: string
          format: date-time
          readOnly: true