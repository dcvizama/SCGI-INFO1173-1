openapi: 3.0.3
info:
  title: SCGI API
  version: 1.0.0-draft
  description: Contrato de la API REST del Sistema Centralizado de Gestión de Infraestructura (SCGI).

# Servidores y versionado se definen en la tarea 3.
servers:
  - url: /api/v1

# Rutas se definen en la tarea 3.
paths: {}

components:
  schemas:

    Rol:
      type: object
      description: Rol del usuario (tabla ROLES).
      required:
        - id_rol
        - nombre_rol
      properties:
        id_rol:
          type: integer
        nombre_rol:
          type: string
          enum:
            - REPORTANTE
            - SUPERVISOR
            - TECNICO
            - ADMINISTRADOR

    Usuario:
      type: object
      description: Usuario del sistema (tabla USUARIOS). No incluye password_hash.
      required:
        - id_usuario
        - rut_o_id
        - nombre
        - apellido
        - correo
        - rol
        - created_at
      properties:
        id_usuario:
          type: string
          format: uuid
        rut_o_id:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        created_at:
          type: string
          format: date-time
          readOnly: true

    Edificio:
      type: object
      description: Edificio de la institución (tabla EDIFICIOS).
      required:
        - id_edificio
        - nombre_edificio
      properties:
        id_edificio:
          type: integer
        nombre_edificio:
          type: string

    Ubicacion:
      type: object
      description: Espacio dentro de un edificio (tabla UBICACIONES).
      required:
        - id_ubicacion
        - nombre_espacio
        - edificio
      properties:
        id_ubicacion:
          type: integer
        nombre_espacio:
          type: string
        edificio:
          $ref: '#/components/schemas/Edificio'

    Categoria:
      type: object
      description: Categoría del activo (tabla CATEGORIAS).
      required:
        - id_categoria
        - nombre_categoria
      properties:
        id_categoria:
          type: integer
        nombre_categoria:
          type: string

    EstadoActivo:
      type: object
      description: Estado del activo (tabla ESTADOS_ACTIVO).
      required:
        - id_estado_activo
        - nombre_estado
      properties:
        id_estado_activo:
          type: integer
        nombre_estado:
          type: string

    Activo:
      type: object
      description: Activo de infraestructura (tabla ACTIVOS). No incluye deleted_at.
      required:
        - id_activo
        - codigo_qr
        - nombre
        - estado
        - categoria
        - ubicacion
        - created_at
      properties:
        id_activo:
          type: string
          format: uuid
        codigo_qr:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        marca:
          type: string
          nullable: true
        modelo:
          type: string
          nullable: true
        numero_serie:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoActivo'
        categoria:
          $ref: '#/components/schemas/Categoria'
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        created_at:
          type: string
          format: date-time
          readOnly: true