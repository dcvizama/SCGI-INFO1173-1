openapi: 3.0.3
info:
  title: SCGI API
  version: 1.3.0
  description: |
    Contrato de la API REST del Sistema Centralizado de Gestion de Infraestructura (SCGI),
    acordado entre Taller de Integracion II (backend y web) y Taller de Integracion IV (app movil).

    Servicios (un microservicio por grupo de rutas):
    - Autenticacion: usuarios, roles y permisos.
    - Activos: edificios, ubicaciones, categorias, activos y mantenimientos preventivos.
    - Incidencias: incidencias, historial de estados, ordenes de trabajo y evidencias.
    - Notificaciones: notificaciones automaticas y dispositivos registrados para push.

    Reglas:
    - Todas las rutas van bajo /api/v1 y se sirven solo por HTTPS (RNF3).
    - Todas las rutas, salvo el inicio de sesion, exigen el token JWT (RNF4).
    - Todos los errores responden con el esquema Error.
    - Los nombres de campos van en espanol, sin tildes ni la letra n con virgulilla.
      Las excepciones son los campos estandar del JWT y los campos de monitoreo
      del esquema Error, que TI2 necesita con esos nombres.
    - El servicio de incidencias guarda solo los identificadores de usuarios y activos,
      porque viven en otras bases de datos. La app los consulta en su propio servicio.

    Versionado:
    - Agregar rutas o campos opcionales sube la version menor (1.1.0 a 1.2.0).
    - Quitar o renombrar rutas o campos, o cambiar su tipo, sube la version mayor (2.0.0)
      y la ruta base pasa a /api/v2.
    - Todo cambio se acuerda entre TI2 y TI4 antes de implementarlo.

    Cambios de la version 1.3.0:
    - Se documenta el ciclo de vida de 8 estados en EstadoIncidencia, con los campos
      opcionales orden y es_final (RF6).
    - Se agrega GET /estados-incidencia/transiciones con los cambios de estado
      permitidos por rol (RF6).
    - CambioEstado admite el campo opcional comentario, y HistorialEstado agrega
      estado_anterior y comentario para la trazabilidad (RF6).
    - PATCH /incidencias/{id_incidencia}/estado responde 409 si la transicion no esta
      permitida desde el estado actual (RF6).
    - Se agrega PATCH /incidencias/{id_incidencia}/clasificacion para que el supervisor
      fije la prioridad y pase la incidencia a Clasificada (RF5).
    - POST /ordenes-trabajo pasa la incidencia a Asignada y responde 409 si no esta
      Clasificada o ya tiene una orden vigente (RF5).
    - Se agrega a Incidencia el campo opcional id_tecnico_asignado, y a GET /incidencias
      el filtro prioridad (RF5).
    - Se agrega GET /usuarios para listar usuarios por rol, usado al elegir tecnico (RF5).
    - Se agrega GET /activos/{id_activo}/historial-fallas (RF2, RF6).
    - Se incorpora el grupo Notificaciones: GET /notificaciones,
      PATCH /notificaciones/{id_notificacion}/leida, POST /dispositivos y
      DELETE /dispositivos/{id_dispositivo} (RF8).
    - Se agrega la respuesta comun Conflicto (409).

    Cambios de la version 1.2.0:
    - Se agrega el esquema Prioridad (baja, media, alta) para el registro de incidencias (RF3).
    - Se agrega prioridad a Incidencia, y a NuevaIncidencia como campo opcional con valor
      por defecto media.
    - Se agrega a Incidencia el arreglo opcional evidencias (RF4).
    - Se limita el largo de titulo (100) y descripcion (1000) en NuevaIncidencia.
    - url_evidencia de NuevaEvidencia debe ser una direccion valida de Cloudinary.
    - POST /incidencias detalla cuando responde 400 y 404.
    - POST /incidencias/{id_incidencia}/evidencias admite como maximo 5 evidencias
      y responde 409 al superar el limite.

    Cambios de la version 1.1.0:
    - Se incorpora el servicio de incidencias completo.
    - Se adopta el formato de error propuesto por TI2, con metadatos de monitoreo.
    - Se traducen al espanol los nombres que estaban en ingles.
    - Se agrega diagnostico_tecnico a las ordenes de trabajo.

servers:
  - url: /api/v1

security:
  - autenticacionJwt: []

tags:
  - name: Autenticacion
    description: Inicio de sesion, usuario actual, usuarios y roles (RF1, RF5).
  - name: Activos
    description: Activos, sus catalogos y mantenimientos preventivos (RF2, RF9).
  - name: Incidencias
    description: Incidencias, ciclo de vida, ordenes de trabajo y evidencias (RF3 a RF7).
  - name: Notificaciones
    description: Notificaciones automaticas y dispositivos registrados para push (RF8).

paths:

  # ----------------------------------------------------------------
  # Servicio de autenticacion
  # ----------------------------------------------------------------

  /autenticacion/inicio-sesion:
    post:
      tags:
        - Autenticacion
      summary: Iniciar sesion con correo y contrasena
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesAcceso'
      responses:
        '200':
          description: Credenciales correctas. Devuelve el token y el usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionIniciada'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          description: Correo o contrasena incorrectos, o usuario eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /autenticacion/usuario-actual:
    get:
      tags:
        - Autenticacion
      summary: Obtener el usuario dueno del token
      description: Se usa al abrir la app para comprobar que el token guardado sigue siendo valido.
      operationId: obtenerUsuarioActual
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /roles:
    get:
      tags:
        - Autenticacion
      summary: Listar los roles y sus permisos
      operationId: listarRoles
      responses:
        '200':
          description: Roles registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rol'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /usuarios:
    get:
      tags:
        - Autenticacion
      summary: Listar usuarios, opcionalmente filtrados por rol
      description: |
        Solo para los roles SUPERVISOR y ADMINISTRADOR. El supervisor la usa con
        rol=TECNICO para elegir el tecnico al asignar una incidencia (RF5).
      operationId: listarUsuarios
      parameters:
        - name: rol
          in: query
          required: false
          description: Filtra por nombre_rol.
          schema:
            type: string
            enum:
              - REPORTANTE
              - SUPERVISOR
              - TECNICO
              - ADMINISTRADOR
      responses:
        '200':
          description: Usuarios que coinciden, ordenados por apellido.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  # ----------------------------------------------------------------
  # Servicio de activos
  # ----------------------------------------------------------------

  /activos:
    get:
      tags:
        - Activos
      summary: Buscar activos por texto (busqueda manual)
      description: |
        Busca en nombre y codigo_qr. Se usa cuando el codigo QR no se puede leer
        o no esta registrado.
      operationId: buscarActivos
      parameters:
        - name: busqueda
          in: query
          required: true
          description: Texto a buscar.
          schema:
            type: string
            minLength: 1
        - name: limite
          in: query
          required: false
          description: Cantidad maxima de resultados.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Activos que coinciden. Lista vacia si no hay coincidencias.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /activos/codigo-qr/{codigo_qr}:
    get:
      tags:
        - Activos
      summary: Obtener un activo a partir del contenido de su codigo QR
      operationId: obtenerActivoPorCodigoQr
      parameters:
        - name: codigo_qr
          in: path
          required: true
          description: Contenido leido del codigo QR, codificado para URL.
          schema:
            type: string
      responses:
        '200':
          description: Activo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /activos/{id_activo}:
    get:
      tags:
        - Activos
      summary: Obtener un activo por su identificador
      operationId: obtenerActivoPorId
      parameters:
        - $ref: '#/components/parameters/IdActivo'
      responses:
        '200':
          description: Activo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /activos/{id_activo}/historial-fallas:
    get:
      tags:
        - Activos
      summary: Obtener el historial de fallas de un activo
      description: |
        Resume las incidencias registradas sobre el activo (RF2, RF6). Los datos los
        entrega el servicio de incidencias, porque el servicio de activos no las guarda.
      operationId: obtenerHistorialFallasActivo
      parameters:
        - $ref: '#/components/parameters/IdActivo'
        - name: limite
          in: query
          required: false
          description: Cantidad maxima de elementos en fallas. Los totales cuentan todas.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Historial del activo. fallas viene vacio si el activo nunca ha fallado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorialFallasActivo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /edificios:
    get:
      tags:
        - Activos
      summary: Listar los edificios
      operationId: listarEdificios
      responses:
        '200':
          description: Edificios registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Edificio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /ubicaciones:
    get:
      tags:
        - Activos
      summary: Listar las ubicaciones
      operationId: listarUbicaciones
      parameters:
        - name: id_edificio
          in: query
          required: false
          description: Filtra las ubicaciones de un edificio.
          schema:
            type: integer
      responses:
        '200':
          description: Ubicaciones registradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ubicacion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /categorias:
    get:
      tags:
        - Activos
      summary: Listar las categorias de activos
      operationId: listarCategorias
      responses:
        '200':
          description: Categorias registradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /estados-activo:
    get:
      tags:
        - Activos
      summary: Listar los estados posibles de un activo
      operationId: listarEstadosActivo
      responses:
        '200':
          description: Estados registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstadoActivo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /mantenimientos:
    get:
      tags:
        - Activos
      summary: Listar los mantenimientos preventivos programados
      operationId: listarMantenimientos
      parameters:
        - name: id_activo
          in: query
          required: false
          description: Filtra los mantenimientos de un activo.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mantenimientos programados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MantenimientoPreventivo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags:
        - Activos
      summary: Programar un mantenimiento preventivo
      description: Solo para el rol ADMINISTRADOR.
      operationId: programarMantenimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoMantenimiento'
      responses:
        '201':
          description: Mantenimiento programado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MantenimientoPreventivo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  # ----------------------------------------------------------------
  # Servicio de incidencias
  # ----------------------------------------------------------------

  /incidencias:
    get:
      tags:
        - Incidencias
      summary: Listar incidencias
      description: |
        Ordenadas de la mas reciente a la mas antigua. La bandeja del supervisor
        usa id_estado=1 (Pendiente de revision) (RF5).
      operationId: listarIncidencias
      parameters:
        - name: id_activo
          in: query
          required: false
          description: Filtra las incidencias de un activo.
          schema:
            type: string
            format: uuid
        - name: id_estado
          in: query
          required: false
          description: Filtra por el estado actual de la incidencia.
          schema:
            type: integer
        - name: prioridad
          in: query
          required: false
          description: Filtra por prioridad.
          schema:
            type: string
            enum:
              - baja
              - media
              - alta
        - name: limite
          in: query
          required: false
          description: Cantidad maxima de resultados.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Incidencias que coinciden.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incidencia'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags:
        - Incidencias
      summary: Registrar una incidencia sobre un activo
      description: |
        El reportante es el usuario del token. La incidencia nace en el primer estado
        del ciclo de vida (Pendiente de revision). Cualquier rol autenticado puede reportar (RF3).
        Las evidencias se adjuntan despues con POST /incidencias/{id_incidencia}/evidencias.
        Genera una notificacion nueva_incidencia para los supervisores (RF8).
      operationId: registrarIncidencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaIncidencia'
      responses:
        '201':
          description: Incidencia registrada en estado Pendiente de revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incidencia'
        '400':
          description: |
            Faltan id_activo, titulo o descripcion; superan el largo maximo;
            id_activo no es un UUID, o prioridad no es baja, media ni alta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: El activo indicado en id_activo no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /incidencias/{id_incidencia}:
    get:
      tags:
        - Incidencias
      summary: Obtener una incidencia por su identificador
      operationId: obtenerIncidencia
      parameters:
        - $ref: '#/components/parameters/IdIncidencia'
      responses:
        '200':
          description: Incidencia encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incidencia'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /incidencias/{id_incidencia}/estado:
    patch:
      tags:
        - Incidencias
      summary: Cambiar el estado de una incidencia
      description: |
        Registra el cambio en el historial con el usuario del token, el estado anterior
        y el comentario (RF6). Solo acepta las transiciones de
        GET /estados-incidencia/transiciones para el rol del usuario: responde 403 si el
        rol no puede hacerla y 409 si no esta permitida desde el estado actual.
        El paso a Clasificada se hace con PATCH /incidencias/{id_incidencia}/clasificacion
        y el paso a Asignada con POST /ordenes-trabajo, porque necesitan datos extra.
        Genera una notificacion cambio_estado para el reportante (RF8).
      operationId: cambiarEstadoIncidencia
      parameters:
        - $ref: '#/components/parameters/IdIncidencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstado'
      responses:
        '200':
          description: Incidencia con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incidencia'
        '400':
          description: Falta id_estado, el estado no existe o falta el comentario que la transicion exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /incidencias/{id_incidencia}/clasificacion:
    patch:
      tags:
        - Incidencias
      summary: Clasificar una incidencia pendiente
      description: |
        Solo para el rol SUPERVISOR (RF5). Fija la prioridad definitiva y pasa la incidencia
        de Pendiente de revision a Clasificada, registrando el cambio en el historial.
        Responde 409 si la incidencia no esta en Pendiente de revision.
      operationId: clasificarIncidencia
      parameters:
        - $ref: '#/components/parameters/IdIncidencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Clasificacion'
      responses:
        '200':
          description: Incidencia clasificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incidencia'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /incidencias/{id_incidencia}/historial:
    get:
      tags:
        - Incidencias
      summary: Listar el historial de estados de una incidencia
      operationId: listarHistorialIncidencia
      parameters:
        - $ref: '#/components/parameters/IdIncidencia'
      responses:
        '200':
          description: Cambios de estado, del mas antiguo al mas reciente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistorialEstado'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /incidencias/{id_incidencia}/evidencias:
    get:
      tags:
        - Incidencias
      summary: Listar las evidencias de una incidencia
      operationId: listarEvidencias
      parameters:
        - $ref: '#/components/parameters/IdIncidencia'
      responses:
        '200':
          description: Evidencias adjuntas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evidencia'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags:
        - Incidencias
      summary: Adjuntar una evidencia a una incidencia
      description: |
        La app sube el archivo a Cloudinary y envia aqui la direccion resultante (RF4).
        Se envia una peticion por cada foto. Una incidencia admite como maximo 5 evidencias.
      operationId: adjuntarEvidencia
      parameters:
        - $ref: '#/components/parameters/IdIncidencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaEvidencia'
      responses:
        '201':
          description: Evidencia adjuntada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidencia'
        '400':
          description: Falta url_evidencia, no es una direccion valida o id_tipo_evidencia no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          description: La incidencia indicada no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La incidencia ya tiene el maximo de 5 evidencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /ordenes-trabajo:
    get:
      tags:
        - Incidencias
      summary: Listar ordenes de trabajo
      operationId: listarOrdenesTrabajo
      parameters:
        - name: id_incidencia
          in: query
          required: false
          description: Filtra las ordenes de una incidencia.
          schema:
            type: string
            format: uuid
        - name: id_tecnico
          in: query
          required: false
          description: Filtra las ordenes asignadas a un tecnico.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordenes de trabajo que coinciden.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrdenTrabajo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'
    post:
      tags:
        - Incidencias
      summary: Crear una orden de trabajo y asignarla a un tecnico
      description: |
        Solo para el rol SUPERVISOR (RF5). Pasa la incidencia de Clasificada a Asignada,
        registra el cambio en el historial y genera una notificacion incidencia_asignada
        para el tecnico (RF8). Responde 404 si la incidencia o el tecnico no existen,
        y 409 si la incidencia no esta Clasificada o ya tiene una orden vigente.
      operationId: crearOrdenTrabajo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaOrdenTrabajo'
      responses:
        '201':
          description: Orden de trabajo creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenTrabajo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /ordenes-trabajo/{id_orden}:
    get:
      tags:
        - Incidencias
      summary: Obtener una orden de trabajo por su identificador
      operationId: obtenerOrdenTrabajo
      parameters:
        - $ref: '#/components/parameters/IdOrden'
      responses:
        '200':
          description: Orden de trabajo encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenTrabajo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /ordenes-trabajo/{id_orden}/diagnostico:
    patch:
      tags:
        - Incidencias
      summary: Registrar el diagnostico tecnico de una orden de trabajo
      description: Solo para el rol TECNICO, y solo el tecnico asignado a la orden.
      operationId: registrarDiagnosticoTecnico
      parameters:
        - $ref: '#/components/parameters/IdOrden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoDiagnostico'
      responses:
        '200':
          description: Orden de trabajo con su diagnostico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenTrabajo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /estados-incidencia:
    get:
      tags:
        - Incidencias
      summary: Listar los estados del ciclo de vida de una incidencia
      operationId: listarEstadosIncidencia
      responses:
        '200':
          description: Estados registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstadoIncidencia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /estados-incidencia/transiciones:
    get:
      tags:
        - Incidencias
      summary: Listar las transiciones permitidas del ciclo de vida
      description: |
        Indica desde que estado se puede pasar a cual, que roles pueden hacerlo y si
        exige comentario (RF6). La app la usa para mostrar solo las acciones validas.
        Matriz del ciclo de vida:
        - 1 Pendiente de revision a 2 Clasificada: SUPERVISOR, con la ruta de clasificacion.
        - 1 Pendiente de revision a 8 Cerrada: SUPERVISOR, con comentario (reporte descartado).
        - 2 Clasificada a 3 Asignada: SUPERVISOR, al crear la orden de trabajo.
        - 3 Asignada a 4 En diagnostico: TECNICO.
        - 4 En diagnostico a 5 En reparacion: TECNICO.
        - 5 En reparacion a 6 Resuelta: TECNICO, con comentario.
        - 6 Resuelta a 7 Verificada: SUPERVISOR.
        - 6 Resuelta a 5 En reparacion: SUPERVISOR, con comentario (solucion rechazada).
        - 7 Verificada a 8 Cerrada: SUPERVISOR.
      operationId: listarTransicionesEstado
      parameters:
        - name: id_estado_origen
          in: query
          required: false
          description: Filtra las transiciones que salen de un estado.
          schema:
            type: integer
      responses:
        '200':
          description: Transiciones permitidas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransicionEstado'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /tipos-evidencia:
    get:
      tags:
        - Incidencias
      summary: Listar los tipos de evidencia
      operationId: listarTiposEvidencia
      responses:
        '200':
          description: Tipos registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoEvidencia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  # ----------------------------------------------------------------
  # Servicio de notificaciones
  # ----------------------------------------------------------------

  /notificaciones:
    get:
      tags:
        - Notificaciones
      summary: Listar las notificaciones del usuario del token
      description: |
        Ordenadas de la mas reciente a la mas antigua (RF8). Las crea el backend ante los
        eventos del ciclo de vida; la app solo las consulta y las marca como leidas.
      operationId: listarNotificaciones
      parameters:
        - name: leida
          in: query
          required: false
          description: Filtra por leidas (true) o no leidas (false).
          schema:
            type: boolean
        - name: limite
          in: query
          required: false
          description: Cantidad maxima de resultados.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Notificaciones del usuario. Lista vacia si no tiene.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificacion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /notificaciones/{id_notificacion}/leida:
    patch:
      tags:
        - Notificaciones
      summary: Marcar una notificacion como leida
      description: |
        No lleva cuerpo. Solo el usuario destino puede marcarla; para otro usuario
        responde 404. Si ya estaba leida, responde igual sin cambiar fecha_lectura.
      operationId: marcarNotificacionLeida
      parameters:
        - $ref: '#/components/parameters/IdNotificacion'
      responses:
        '200':
          description: Notificacion marcada como leida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /dispositivos:
    post:
      tags:
        - Notificaciones
      summary: Registrar el dispositivo del usuario para recibir notificaciones push
      description: |
        La app lo llama despues de iniciar sesion, con el token de expo-notifications (RF8, RNF6).
        Si el token ya estaba registrado, lo asocia al usuario del token y responde 200.
      operationId: registrarDispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoDispositivo'
      responses:
        '200':
          description: El token ya estaba registrado y queda asociado al usuario actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '201':
          description: Dispositivo registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispositivo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

  /dispositivos/{id_dispositivo}:
    delete:
      tags:
        - Notificaciones
      summary: Dar de baja un dispositivo
      description: |
        La app lo llama al cerrar sesion, antes de borrar el token, para que el dispositivo
        deje de recibir push. Solo el dueno puede darlo de baja; para otro usuario responde 404.
      operationId: eliminarDispositivo
      parameters:
        - $ref: '#/components/parameters/IdDispositivo'
      responses:
        '204':
          description: Dispositivo dado de baja.
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorServidor'

components:

  securitySchemes:
    autenticacionJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token que devuelve POST /autenticacion/inicio-sesion. Se envia en cada peticion protegida:
        Authorization: Bearer <token>

        El contenido del token debe incluir:
        - sub: id_usuario (UUID).
        - rol: nombre_rol, con los mismos valores del esquema Rol.
        - exp: fecha de expiracion, en segundos.

        Los nombres sub y exp estan fijados por el estandar del JWT y por eso no se traducen.

  parameters:
    IdActivo:
      name: id_activo
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdIncidencia:
      name: id_incidencia
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdOrden:
      name: id_orden
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdNotificacion:
      name: id_notificacion
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdDispositivo:
      name: id_dispositivo
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    DatosInvalidos:
      description: La peticion tiene datos faltantes o con formato incorrecto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Falta el token, es invalido o expiro. La app debe cerrar la sesion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El rol del usuario no permite esta accion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: La accion no es valida para el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorServidor:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Error:
      type: object
      description: |
        Formato unico de todos los errores, generado por el filtro global de TI2.
        La app muestra mensaje; los demas campos son para monitoreo y registro.
      required:
        - statusCode
        - mensaje
        - message
        - timestamp
        - path
      properties:
        statusCode:
          type: integer
          description: Codigo HTTP de la respuesta.
        mensaje:
          type: string
          description: Explicacion del error, apta para mostrar al usuario.
        message:
          type: string
          description: Mismo texto de mensaje. Se mantiene por compatibilidad con las herramientas de TI2.
        timestamp:
          type: string
          format: date-time
          description: Momento en que ocurrio el error.
        path:
          type: string
          description: Ruta que fallo.

    CredencialesAcceso:
      type: object
      required:
        - correo
        - contrasena
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
          writeOnly: true

    SesionIniciada:
      type: object
      required:
        - token
        - usuario
      properties:
        token:
          type: string
          description: JWT firmado. Su contenido se describe en autenticacionJwt.
        usuario:
          $ref: '#/components/schemas/Usuario'

    Permiso:
      type: object
      description: Permiso asignable a un rol (tabla PERMISOS).
      required:
        - id_permiso
        - nombre_permiso
      properties:
        id_permiso:
          type: integer
        nombre_permiso:
          type: string
        descripcion:
          type: string
          nullable: true

    Rol:
      type: object
      description: Rol del usuario (tabla ROLES).
      required:
        - id_rol
        - nombre_rol
      properties:
        id_rol:
          type: integer
        nombre_rol:
          type: string
          enum:
            - REPORTANTE
            - SUPERVISOR
            - TECNICO
            - ADMINISTRADOR
        permisos:
          type: array
          description: Permisos del rol (tabla ROLES_PERMISOS). Solo se envia en la ruta de roles.
          items:
            $ref: '#/components/schemas/Permiso'

    Usuario:
      type: object
      description: Usuario del sistema (tabla USUARIOS). No incluye la contrasena.
      required:
        - id_usuario
        - rut_o_id
        - nombre
        - apellido
        - correo
        - rol
        - fecha_creacion
      properties:
        id_usuario:
          type: string
          format: uuid
        rut_o_id:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true

    Edificio:
      type: object
      description: Edificio de la institucion (tabla EDIFICIOS).
      required:
        - id_edificio
        - nombre_edificio
      properties:
        id_edificio:
          type: integer
        nombre_edificio:
          type: string

    Ubicacion:
      type: object
      description: Espacio dentro de un edificio (tabla UBICACIONES).
      required:
        - id_ubicacion
        - nombre_espacio
        - edificio
      properties:
        id_ubicacion:
          type: integer
        nombre_espacio:
          type: string
        edificio:
          $ref: '#/components/schemas/Edificio'

    Categoria:
      type: object
      description: Categoria del activo (tabla CATEGORIAS).
      required:
        - id_categoria
        - nombre_categoria
      properties:
        id_categoria:
          type: integer
        nombre_categoria:
          type: string

    EstadoActivo:
      type: object
      description: Estado del activo (tabla ESTADOS_ACTIVO).
      required:
        - id_estado_activo
        - nombre_estado
      properties:
        id_estado_activo:
          type: integer
        nombre_estado:
          type: string

    Activo:
      type: object
      description: Activo de infraestructura (tabla ACTIVOS).
      required:
        - id_activo
        - codigo_qr
        - nombre
        - estado
        - categoria
        - ubicacion
        - fecha_creacion
      properties:
        id_activo:
          type: string
          format: uuid
        codigo_qr:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        marca:
          type: string
          nullable: true
        modelo:
          type: string
          nullable: true
        numero_serie:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoActivo'
        categoria:
          $ref: '#/components/schemas/Categoria'
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true

    MantenimientoPreventivo:
      type: object
      description: Mantenimiento programado para un activo (tabla MANTENIMIENTOS_PREVENTIVOS).
      required:
        - id_mantenimiento
        - id_activo
        - fecha_programada
        - fecha_creacion
      properties:
        id_mantenimiento:
          type: string
          format: uuid
        id_activo:
          type: string
          format: uuid
        fecha_programada:
          type: string
          format: date
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true

    NuevoMantenimiento:
      type: object
      required:
        - id_activo
        - fecha_programada
      properties:
        id_activo:
          type: string
          format: uuid
        fecha_programada:
          type: string
          format: date

    Prioridad:
      type: string
      description: |
        Prioridad de la incidencia (columna prioridad de INCIDENCIAS). El reportante
        propone una al registrarla y el supervisor la fija al clasificarla (RF5).
      enum:
        - baja
        - media
        - alta
      default: media

    EstadoIncidencia:
      type: object
      description: |
        Estado del ciclo de vida de una incidencia (tabla ESTADOS_INCIDENCIA).
        Valores del ciclo de vida (RF6):
        1 Pendiente de revision, 2 Clasificada, 3 Asignada, 4 En diagnostico,
        5 En reparacion, 6 Resuelta, 7 Verificada, 8 Cerrada.
      required:
        - id_estado
        - nombre_estado
      properties:
        id_estado:
          type: integer
        nombre_estado:
          type: string
        orden:
          type: integer
          minimum: 1
          description: Posicion del estado en el ciclo de vida. La app la usa para dibujar la linea de tiempo.
        es_final:
          type: boolean
          description: Indica que la incidencia ya no admite cambios de estado.

    Incidencia:
      type: object
      description: |
        Falla reportada sobre un activo (tabla INCIDENCIAS).
        id_activo e id_reportante viven en otras bases de datos, por eso solo viaja su identificador.
        estado es el ultimo registro del historial, no una columna de la tabla.
        evidencias solo se incluye cuando la respuesta las trae adjuntas; tambien se obtienen con
        GET /incidencias/{id_incidencia}/evidencias.
      required:
        - id_incidencia
        - id_activo
        - id_reportante
        - titulo
        - descripcion
        - prioridad
        - estado
        - fecha_creacion
      properties:
        id_incidencia:
          type: string
          format: uuid
        id_activo:
          type: string
          format: uuid
        id_reportante:
          type: string
          format: uuid
        titulo:
          type: string
        descripcion:
          type: string
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        estado:
          $ref: '#/components/schemas/EstadoIncidencia'
        id_tecnico_asignado:
          type: string
          format: uuid
          nullable: true
          description: Tecnico de la orden de trabajo vigente. Null mientras no se asigne (RF5).
        evidencias:
          type: array
          items:
            $ref: '#/components/schemas/Evidencia'
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true

    NuevaIncidencia:
      type: object
      description: Si no se envia prioridad, el backend usa media.
      required:
        - id_activo
        - titulo
        - descripcion
      properties:
        id_activo:
          type: string
          format: uuid
        titulo:
          type: string
          minLength: 1
          maxLength: 100
        descripcion:
          type: string
          minLength: 1
          maxLength: 1000
        prioridad:
          $ref: '#/components/schemas/Prioridad'

    CambioEstado:
      type: object
      description: |
        Datos para mover una incidencia a otro estado (RF6).
        comentario es opcional en el contrato para mantener la compatibilidad con 1.x.
        La app lo exige siempre, y el backend lo exige cuando la transicion
        tiene requiere_comentario en verdadero.
      required:
        - id_estado
      properties:
        id_estado:
          type: integer
          description: Estado al que pasa la incidencia.
        comentario:
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo del cambio. Queda guardado en el historial.

    Clasificacion:
      type: object
      description: Datos con que el supervisor clasifica una incidencia pendiente (RF5).
      required:
        - prioridad
      properties:
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        comentario:
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo de la clasificacion. Queda guardado en el historial.

    HistorialEstado:
      type: object
      description: |
        Cambio de estado de una incidencia (tabla HISTORIAL_ESTADOS).
        Cada registro es un punto de la trazabilidad (RF6): quien cambio el estado,
        desde cual, hacia cual, cuando y por que.
      required:
        - id_historial
        - id_incidencia
        - estado
        - id_usuario_cambio
        - fecha_creacion
      properties:
        id_historial:
          type: string
          format: uuid
        id_incidencia:
          type: string
          format: uuid
        estado_anterior:
          nullable: true
          description: Estado previo. Es null en el primer registro, cuando la incidencia nace.
          allOf:
            - $ref: '#/components/schemas/EstadoIncidencia'
        estado:
          $ref: '#/components/schemas/EstadoIncidencia'
        id_usuario_cambio:
          type: string
          format: uuid
        comentario:
          type: string
          nullable: true
          description: Motivo del cambio enviado en CambioEstado.
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true

    TransicionEstado:
      type: object
      description: |
        Cambio de estado permitido en el ciclo de vida (RF6).
        La app la usa para mostrar solo las acciones validas segun el estado actual y el rol.
      required:
        - id_estado_origen
        - id_estado_destino
        - roles_permitidos
        - requiere_comentario
      properties:
        id_estado_origen:
          type: integer
        id_estado_destino:
          type: integer
        roles_permitidos:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - REPORTANTE
              - SUPERVISOR
              - TECNICO
              - ADMINISTRADOR
        requiere_comentario:
          type: boolean

    ResumenFalla:
      type: object
      description: Incidencia resumida para el historial de fallas de un activo (RF6).
      required:
        - id_incidencia
        - titulo
        - prioridad
        - estado
        - fecha_creacion
      properties:
        id_incidencia:
          type: string
          format: uuid
        titulo:
          type: string
        prioridad:
          $ref: '#/components/schemas/Prioridad'
        estado:
          $ref: '#/components/schemas/EstadoIncidencia'
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_cierre:
          type: string
          format: date-time
          nullable: true
          description: Fecha en que la incidencia llego a un estado final. Null si sigue abierta.

    HistorialFallasActivo:
      type: object
      description: |
        Historial de fallas de un activo (RF2, RF6). Lo arma el servicio de incidencias
        filtrando por id_activo, porque el servicio de activos no guarda incidencias.
      required:
        - id_activo
        - total_fallas
        - fallas_abiertas
        - fallas
      properties:
        id_activo:
          type: string
          format: uuid
        total_fallas:
          type: integer
          minimum: 0
        fallas_abiertas:
          type: integer
          minimum: 0
          description: Incidencias que todavia no llegan a un estado final.
        fallas:
          type: array
          description: Ordenadas de la mas reciente a la mas antigua.
          items:
            $ref: '#/components/schemas/ResumenFalla'

    OrdenTrabajo:
      type: object
      description: Trabajo asignado a un tecnico para resolver una incidencia (tabla ORDENES_TRABAJO).
      required:
        - id_orden
        - id_incidencia
        - id_tecnico
        - fecha_creacion
      properties:
        id_orden:
          type: string
          format: uuid
        id_incidencia:
          type: string
          format: uuid
        id_tecnico:
          type: string
          format: uuid
        diagnostico_tecnico:
          type: string
          nullable: true
          description: Diagnostico que escribe el tecnico. Vacio mientras no lo registre.
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true

    NuevaOrdenTrabajo:
      type: object
      required:
        - id_incidencia
        - id_tecnico
      properties:
        id_incidencia:
          type: string
          format: uuid
        id_tecnico:
          type: string
          format: uuid

    NuevoDiagnostico:
      type: object
      required:
        - diagnostico_tecnico
      properties:
        diagnostico_tecnico:
          type: string
          minLength: 1

    TipoEvidencia:
      type: object
      description: Tipo de evidencia adjunta (tabla TIPOS_EVIDENCIA).
      required:
        - id_tipo_evidencia
        - nombre_tipo
      properties:
        id_tipo_evidencia:
          type: integer
        nombre_tipo:
          type: string

    Evidencia:
      type: object
      description: Archivo adjunto a una incidencia (tabla EVIDENCIAS).
      required:
        - id_evidencia
        - id_incidencia
        - tipo
        - url_evidencia
        - fecha_creacion
      properties:
        id_evidencia:
          type: string
          format: uuid
        id_incidencia:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        url_evidencia:
          type: string
          description: Direccion del archivo en Cloudinary (columna url_cloudinary).
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true

    NuevaEvidencia:
      type: object
      required:
        - id_tipo_evidencia
        - url_evidencia
      properties:
        id_tipo_evidencia:
          type: integer
        url_evidencia:
          type: string
          format: uri
          description: secure_url que devuelve Cloudinary (HTTPS, RNF3).

    # ----------------------------------------------------------------
    # Notificaciones (RF8)
    # ----------------------------------------------------------------

    TipoNotificacion:
      type: string
      description: |
        Evento que genera la notificacion (RF8):
        - nueva_incidencia: se registro una incidencia. Destino: supervisores.
        - incidencia_asignada: se creo una orden de trabajo. Destino: tecnico asignado.
        - cambio_estado: la incidencia cambio de estado. Destino: reportante.
      enum:
        - nueva_incidencia
        - incidencia_asignada
        - cambio_estado

    Notificacion:
      type: object
      description: |
        Aviso automatico que genera el backend ante un evento del ciclo de vida (RF8)
        (tabla NOTIFICACIONES). Se envia como push a los dispositivos registrados
        del usuario y queda guardado para listarlo en la app.
      required:
        - id_notificacion
        - id_usuario_destino
        - tipo
        - titulo
        - mensaje
        - leida
        - fecha_creacion
      properties:
        id_notificacion:
          type: string
          format: uuid
        id_usuario_destino:
          type: string
          format: uuid
        id_incidencia:
          type: string
          format: uuid
          nullable: true
          description: Incidencia relacionada. La app la usa para abrir el detalle del ticket al pulsar la notificacion.
        tipo:
          $ref: '#/components/schemas/TipoNotificacion'
        titulo:
          type: string
          maxLength: 100
        mensaje:
          type: string
          maxLength: 500
        leida:
          type: boolean
          default: false
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
        fecha_lectura:
          type: string
          format: date-time
          nullable: true

    CargaNotificacionPush:
      type: object
      description: |
        Contenido del campo data de la notificacion push que llega por Expo.
        El listener de la app lo lee para redirigir al detalle del ticket.
      required:
        - id_notificacion
        - tipo
      properties:
        id_notificacion:
          type: string
          format: uuid
        id_incidencia:
          type: string
          format: uuid
          nullable: true
        tipo:
          $ref: '#/components/schemas/TipoNotificacion'

    Plataforma:
      type: string
      enum:
        - android
        - ios

    NuevoDispositivo:
      type: object
      description: Registro del token push del dispositivo para recibir notificaciones (RF8, RNF6).
      required:
        - token_expo
        - plataforma
      properties:
        token_expo:
          type: string
          pattern: '^Expo(nent)?PushToken\[.+\]$'
          description: Token que entrega expo-notifications con getExpoPushTokenAsync.
        plataforma:
          $ref: '#/components/schemas/Plataforma'

    Dispositivo:
      type: object
      description: Dispositivo registrado de un usuario (tabla DISPOSITIVOS).
      required:
        - id_dispositivo
        - id_usuario
        - token_expo
        - plataforma
        - fecha_creacion
      properties:
        id_dispositivo:
          type: string
          format: uuid
        id_usuario:
          type: string
          format: uuid
        token_expo:
          type: string
        plataforma:
          $ref: '#/components/schemas/Plataforma'
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true